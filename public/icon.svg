<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="ss-ic-blue-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0091FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ss-ic-blue-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066D6"/>
      <stop offset="100%" stop-color="#004399"/>
    </linearGradient>
    <linearGradient id="ss-ic-blue-facet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="ss-ic-blue-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003566"/>
      <stop offset="100%" stop-color="#001D3D"/>
    </linearGradient>

    <linearGradient id="ss-ic-red-apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF384D"/>
      <stop offset="60%" stop-color="#E5192D"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="ss-ic-red-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5192D"/>
      <stop offset="45%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="ss-ic-red-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>

    <linearGradient id="ss-ic-silver-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="ss-ic-silver-facet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="ss-ic-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle (corporate Navy) -->
  <rect width="96" height="96" rx="22" fill="#0B1F3A"/>
  <rect x="1" y="1" width="94" height="94" rx="21" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- EMBLEM ICON -->
  <g transform="translate(4, 7) scale(0.8)">
    <path d="M 4 80 Q 52 75 106 80 Q 52 83.5 4 80 Z" fill="url(#ss-ic-base)" />
    <path d="M 10 80.5 Q 52 77 100 80.5" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.95" fill="none" />

    <!-- Left Blue Tower -->
    <path d="M 25 34 L 42 22 L 42 78 L 25 78 Z" fill="url(#ss-ic-blue-dark)" />
    <path d="M 16 42 L 25 34 L 25 78 L 16 78 Z" fill="url(#ss-ic-blue-facet)" />
    <path d="M 10 64 L 10 50 L 23 41 L 23 78 L 10 64 Z" fill="url(#ss-ic-blue-front)" />
    <path d="M 10 50 L 23 41 L 38 29 L 26 40 Z" fill="url(#ss-ic-blue-top)" />
    <path d="M 23 41 L 38 29 L 38 78 L 23 78 Z" fill="url(#ss-ic-blue-front)" />
    <path d="M 38 29 L 45 24 L 45 78 L 38 78 Z" fill="url(#ss-ic-blue-dark)" />
    <path d="M 10 50 L 23 41 L 38 29" stroke="#93C5FD" stroke-width="0.85" stroke-opacity="0.9" fill="none" />

    <!-- Center Red Tower -->
    <path d="M 47 12 L 59 3 L 70 24 L 47 32 Z" fill="url(#ss-ic-red-apex)" />
    <path d="M 59 3 L 72 16 L 70 24 Z" fill="#FF6B7A" />
    <path d="M 47 32 L 59 25 L 59 78 L 47 78 Z" fill="url(#ss-ic-red-body)" />
    <path d="M 47 12 L 47 78" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.95" />
    <path d="M 59 25 L 59 78" stroke="#FFA3AD" stroke-width="0.6" stroke-opacity="0.6" />
    <path d="M 59 25 L 72 16 L 72 78 L 59 78 Z" fill="url(#ss-ic-red-shadow)" />

    <!-- Right Silver Tower -->
    <path d="M 74 42 L 93 54 L 93 78 L 74 78 Z" fill="url(#ss-ic-silver-facet)" />
    <path d="M 74 42 L 83 37 L 83 78 L 74 78 Z" fill="url(#ss-ic-silver-front)" />
    <path d="M 83 37 L 93 54" stroke="#FFFFFF" stroke-width="0.85" fill="none" />
  </g>
</svg>
